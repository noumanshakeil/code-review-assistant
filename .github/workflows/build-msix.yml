name: Build MSIX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Brand assets
        run: python scripts/generate-brand-assets.py
      - name: Build AppX / MSIX
        run: npm run build:msix
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: code-review-assistant-msix
          path: |
            release/*.appx
            release/*.appxupload
            store-assets/**
