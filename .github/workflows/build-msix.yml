name: Build MSIX

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: python -m pip install pillow
      - name: Install
        run: npm ci
      - name: Brand assets
        run: python scripts/generate-brand-assets.py
      - name: Build AppX / MSIX
        id: build
        continue-on-error: true
        run: npm run build:msix
      - name: Dump AppxManifest on failure
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse release -Filter AppxManifest.xml | ForEach-Object {
            Write-Host "==== $($_.FullName) ===="
            Get-Content $_.FullName
          }
          Get-ChildItem -Recurse release -Filter mapping.txt | ForEach-Object {
            Write-Host "==== $($_.FullName) ===="
            Get-Content $_.FullName | Select-Object -First 80
          }
      - name: Upload package or staging
        uses: actions/upload-artifact@v4
        with:
          name: code-review-assistant-msix
          path: |
            release/*.appx
            release/*.appxupload
            release/__appx-*/**
            store-assets/**
          if-no-files-found: warn
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
