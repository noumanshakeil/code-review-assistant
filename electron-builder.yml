appId: com.pocketmind.codereviewassistant
productName: Code Review Assistant
copyright: Copyright © PocketMind
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: appx
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}.${ext}"
  signtoolOptions:
    publisherName: PocketMind
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Code Review Assistant
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
appx:
  identityName: PocketMind.CodeReviewAssistant
  # Replace with your Partner Center Publisher ID CN before Store upload.
  publisher: CN=PocketMind
  publisherDisplayName: PocketMind
  displayName: Code Review Assistant
  applicationId: CodeReviewAssistant
  backgroundColor: "#0F1720"
  languages:
    - en-US
  showNameOnTiles: false
  setBuildNumber: true
  capabilities:
    - runFullTrust
    - internetClient
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icon.png
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: build/icon.png
