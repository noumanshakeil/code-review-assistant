appId: com.pocketmind.aireviewerandhumanizer
productName: "PocketMind AI: Reviewer And Humanizer"
copyright: Copyright (c) PocketMind
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"
win:
  icon: build/icon.ico
  executableName: PocketMindAIReviewerAndHumanizer
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: appx
      arch:
        - x64
  artifactName: "PocketMindAIReviewerAndHumanizer-${version}-${arch}.${ext}"
  signtoolOptions:
    publisherName: PocketMind
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "PocketMind AI: Reviewer And Humanizer"
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
appx:
  # Must match Partner Center reserved identity exactly
  identityName: PocketMind.PocketMindAIReviewerAndHumanizer
  publisher: CN=78BD2D1C-2460-451B-91FD-410288D37531
  publisherDisplayName: PocketMind
  displayName: "PocketMind AI: Reviewer And Humanizer"
  applicationId: PocketMindAIReviewerAndHumanizer
  backgroundColor: "#0F1720"
  languages:
    - en-US
  showNameOnTiles: false
  setBuildNumber: false
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icon.png
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: build/icon.png
